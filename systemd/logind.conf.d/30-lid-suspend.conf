[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend

# Default is 30s: systemd ignores lid events for this long after startup or
# resume, to let it detect hotplugged docks/external monitors first. This
# tablet has no external display output, so that grace period only gets in
# the way when testing (closing the lid again soon after waking silently
# does nothing). Shortened here; see README section 4 before changing.
HoldoffTimeoutSec=5
